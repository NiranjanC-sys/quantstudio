[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "redquant-quantum-kernel"
version = "1.0.0"
description = "RedQuant simulation service: statevector, density-matrix, noise, transpilation, grading and sandboxed execution."
requires-python = ">=3.12,<3.14"
license = { text = "UNLICENSED" }
authors = [{ name = "RedQuant" }]

# Hard dependencies. The service refuses to start without these.
dependencies = [
  "fastapi>=0.111",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "numpy>=1.26",
  "scipy>=1.11",
  "prometheus-client>=0.20",
  "structlog>=24.1",
]

[project.optional-dependencies]
# Heavy SDKs. Every adapter imports these lazily inside a try/except, so a pod
# with none of them installed still starts and still serves the native NumPy
# backend; `GET /v1/backends` reports `available: false` for the rest.
sdk = [
  "qiskit>=1.1",
  "qiskit-aer>=0.14",
  "cirq-core>=1.3",
  "pennylane>=0.36",
]
dev = [
  "pytest>=8.0",
  "httpx>=0.27",
]

[project.scripts]
quantum-kernel = "app.main:run"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
  "slow: takes more than a second (sandbox CPU-limit tests, large ensembles)",
]
filterwarnings = [
  "ignore::DeprecationWarning",
]
