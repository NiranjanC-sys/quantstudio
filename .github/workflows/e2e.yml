name: E2E

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playwright:
    name: Playwright E2E
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda  # v4.1.0
        with:
          version: "11.21.0"

      - name: Setup Node
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af  # v4.1.0
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Resolve Playwright version
        id: pw-version
        run: |
          set -euo pipefail
          version="$(pnpm list playwright --depth 0 --json 2>/dev/null | python3 -c "
          import json, sys
          try:
              data = json.load(sys.stdin)
              entry = data[0] if isinstance(data, list) else data
              deps = entry.get('devDependencies', {}) or entry.get('dependencies', {})
              print(deps.get('playwright', {}).get('version', 'unknown'))
          except Exception:
              print('unknown')
          ")"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57  # v4.2.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw-version.outputs.version }}

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Build compose stack images
        run: docker compose -f infra/docker/docker-compose.yml build

      - name: Bring up compose stack
        run: docker compose -f infra/docker/docker-compose.yml up -d --wait

      - name: Run Playwright tests
        id: playwright
        working-directory: apps/web
        run: |
          set -euo pipefail
          if [ -f playwright.config.ts ] || [ -f playwright.config.js ]; then
            pnpm exec playwright test
          else
            echo "::warning::no playwright.config.{ts,js} found in apps/web yet, skipping E2E run"
          fi

      - name: Dump compose logs on failure
        if: failure()
        run: docker compose -f infra/docker/docker-compose.yml logs --no-color > compose-logs.txt

      - name: Upload compose logs on failure
        if: failure()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882  # v4.4.3
        with:
          name: compose-logs
          path: compose-logs.txt
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882  # v4.4.3
        with:
          name: playwright-report
          path: apps/web/playwright-report
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882  # v4.4.3
        with:
          name: playwright-traces
          path: apps/web/test-results
          if-no-files-found: ignore
          retention-days: 14

      - name: Tear down compose stack
        if: always()
        run: docker compose -f infra/docker/docker-compose.yml down -v
