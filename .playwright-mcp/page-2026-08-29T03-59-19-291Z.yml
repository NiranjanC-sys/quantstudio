    - generic [ref=f8e33]:
      - paragraph [ref=f8e34]: "Every quantum speedup in this curriculum is the same move performed with different bookkeeping: spread amplitude across many basis states, arrange for the wrong answers to cancel, and read out what survives. Phase kickback is the mechanism that lets a controlled operation write into the control instead of the target, and it is where that cancellation is set up."
      - complementary [ref=f8e35]:
        - generic [ref=f8e36]: Notation
        - paragraph [ref=f8e37]: A relative phase is a phase difference between basis states. A global phase multiplies every amplitude and is unobservable.
