    - region [ref=f6e65]:
      - generic [ref=f6e66]:
        - heading "Reading about superposition is not the same as steering it." [level=2] [ref=f6e68]
        - generic [ref=f6e69]:
          - paragraph [ref=f6e70]: We read twenty syllabi from Caltech, MIT, Berkeley, Stanford, CMU, Oxford, Waterloo, Delft, IBM, Google, Microsoft and Xanadu before writing a single lesson. Five gaps repeated almost everywhere, and each one became a product requirement.
          - generic [ref=f6e71]:
            - generic [ref=f6e72]:
              - term [ref=f6e73]: The linear algebra cliff
              - definition [ref=f6e74]: Most courses assume it and lose people in week two. Ours builds up from probabilistic bits and real-valued qubits, and the placement test lets you skip what you already know.
            - generic [ref=f6e75]:
              - term [ref=f6e76]: Theory and code in different buildings
              - definition [ref=f6e77]: Proof-driven courses ship nothing runnable. Exercise platforms are thin on why. Every lesson here carries a circuit you can run, and every claim has a simulation that confirms it numerically.
            - generic [ref=f6e78]:
              - term [ref=f6e79]: Nothing is retained
              - definition [ref=f6e80]: Spaced repetition drills are generated from every module, not bolted on afterwards.
            - generic [ref=f6e81]:
              - term [ref=f6e82]: No competitive practice
              - definition [ref=f6e83]: Quantum hiring asks for exactly the muscle that timed problems build. Contests run weekly and are rated.
            - generic [ref=f6e84]:
              - term [ref=f6e85]: Noise taught last
              - definition [ref=f6e86]: Every practitioner meets noise on day one of touching hardware, so we introduce it as an observable phenomenon in the core track and formalise it later.
    - region [ref=f6e87]:
      - heading "Eight tracks, 74 modules, 331 lessons." [level=2] [ref=f6e88]
      - paragraph [ref=f6e89]: Arranged as a prerequisite graph, not a playlist. The placement test writes straight into it, so you start where you actually are.
      - list [ref=f6e90]:
        - listitem [ref=f6e91]:
          - generic [ref=f6e92]: T0
          - generic [ref=f6e93]:
            - heading "Mathematical and Computational Foundations" [level=3] [ref=f6e94]
            - paragraph [ref=f6e95]: The linear algebra, probability and reversible computation every other course assumes you already have.
          - generic [ref=f6e96]: L0
          - generic [ref=f6e97]: 31 lessons
        - listitem [ref=f6e98]:
          - generic [ref=f6e99]: T1
          - generic [ref=f6e100]:
            - heading "Quantum Computing Core" [level=3] [ref=f6e101]
            - paragraph [ref=f6e102]: Qubits, measurement, entanglement, nonlocality, the circuit model, and your first four algorithms.
          - generic [ref=f6e103]: L1
          - generic [ref=f6e104]: 61 lessons
        - listitem [ref=f6e105]:
          - generic [ref=f6e106]: T2
          - generic [ref=f6e107]:
            - heading "Quantum Algorithms and Complexity" [level=3] [ref=f6e108]
            - paragraph [ref=f6e109]: Grover, the Fourier transform, phase estimation, Shor, hidden subgroups, walks, simulation, lower bounds.
          - generic [ref=f6e110]: L2
          - generic [ref=f6e111]: 48 lessons
        - listitem [ref=f6e112]:
          - generic [ref=f6e113]: T3
          - generic [ref=f6e114]:
            - heading "Quantum Software Engineering" [level=3] [ref=f6e115]
            - paragraph [ref=f6e116]: Five SDKs, OpenQASM 3, transpilation, resource estimation, testing quantum code, benchmarking, mitigation.
          - generic [ref=f6e117]: L1
          - generic [ref=f6e118]: 41 lessons
        - listitem [ref=f6e119]:
