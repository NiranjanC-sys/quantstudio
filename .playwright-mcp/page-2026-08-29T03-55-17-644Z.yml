    - region [ref=f6e167]:
      - generic [ref=f6e168]:
        - generic [ref=f6e169]:
          - heading "The lab simulates as you type." [level=2] [ref=f6e170]
          - paragraph [ref=f6e171]: Up to fourteen qubits runs in your browser, so the Bloch sphere and the amplitude table move at frame rate with no round trip. Past that it goes to the server, and the interface says so rather than quietly stalling.
          - paragraph [ref=f6e172]: Drag gates onto wires or write OpenQASM 3. Both are views of one circuit representation, so editing either changes the other. Export to Qiskit, Cirq or PennyLane in one click.
          - link "Open the lab" [ref=f6e173] [cursor=pointer]:
            - /url: /lab
        - list [ref=f6e175]:
          - listitem [ref=f6e176]:
            - generic [ref=f6e177]: 42 gates
            - generic [ref=f6e178]: including parameterised rotations, arbitrary controls, mid-circuit measurement, reset and classical conditions
          - listitem [ref=f6e179]:
            - generic [ref=f6e180]: 4 dialects
            - generic [ref=f6e181]: OpenQASM 3 round trips into the builder; Qiskit, Cirq and PennyLane are export targets
          - listitem [ref=f6e182]:
            - generic [ref=f6e183]: Real noise
            - generic [ref=f6e184]: depolarising, amplitude and phase damping, readout error, and device-derived models
          - listitem [ref=f6e185]:
            - generic [ref=f6e186]: Honest numbers
            - generic [ref=f6e187]: depth, two-qubit count, T-count, Clifford status and shot-noise error bars, on every run
