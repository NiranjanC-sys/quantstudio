apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: redquant-cell-1
resources:
  - ../../base
  - namespace.yaml
components:
  - ../component
labels:
  - pairs:
      redquant.io/cell: "1"
    includeSelectors: true
configMapGenerator:
  - name: cell-id
    literals:
      - CELL_ID=1
generatorOptions:
  disableNameSuffixHash: true
patches:
  - target:
      kind: Deployment
    patch: |-
      - op: replace
        path: /spec/template/spec/affinity/nodeAffinity/preferredDuringSchedulingIgnoredDuringExecution/0/preference/matchExpressions/0/values/0
        value: "1"
