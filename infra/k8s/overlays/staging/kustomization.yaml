apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: redquant-staging
resources:
  - ../../base
  - namespace.yaml
labels:
  - pairs:
      app.kubernetes.io/environment: staging
    includeSelectors: false
patches:
  - target:
      kind: Deployment
      name: web
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: web
      spec:
        replicas: 4
  - target:
      kind: Deployment
      name: api
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: api
      spec:
        replicas: 6
  - target:
      kind: Deployment
      name: quantum-kernel
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: quantum-kernel
      spec:
        replicas: 8
  - target:
      kind: Deployment
      name: quantum-kernel-heavy
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: quantum-kernel-heavy
      spec:
        replicas: 0
  - target:
      kind: Deployment
      name: sandbox-runner
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: sandbox-runner
      spec:
        replicas: 7
  - target:
      kind: Deployment
      name: grader
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: grader
      spec:
        replicas: 3
  - target:
      kind: Deployment
      name: ai-tutor
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: ai-tutor
      spec:
        replicas: 2
  - target:
      kind: HorizontalPodAutoscaler
      name: web
    patch: |-
      apiVersion: autoscaling/v2
      kind: HorizontalPodAutoscaler
      metadata:
        name: web
      spec:
        minReplicas: 4
        maxReplicas: 14
  - target:
      kind: HorizontalPodAutoscaler
      name: api
    patch: |-
      apiVersion: autoscaling/v2
      kind: HorizontalPodAutoscaler
      metadata:
        name: api
      spec:
        minReplicas: 6
        maxReplicas: 20
  - target:
      kind: HorizontalPodAutoscaler
      name: quantum-kernel
    patch: |-
      apiVersion: autoscaling/v2
      kind: HorizontalPodAutoscaler
      metadata:
        name: quantum-kernel
      spec:
        minReplicas: 8
        maxReplicas: 40
  - target:
      kind: HorizontalPodAutoscaler
      name: ai-tutor
    patch: |-
      apiVersion: autoscaling/v2
      kind: HorizontalPodAutoscaler
      metadata:
        name: ai-tutor
      spec:
        minReplicas: 2
        maxReplicas: 8
  - target:
      kind: ScaledObject
      name: grader
    patch: |-
      apiVersion: keda.sh/v1alpha1
      kind: ScaledObject
      metadata:
        name: grader
      spec:
        minReplicaCount: 3
        maxReplicaCount: 13
  - target:
      kind: ScaledObject
      name: quantum-kernel-heavy
    patch: |-
      apiVersion: keda.sh/v1alpha1
      kind: ScaledObject
      metadata:
        name: quantum-kernel-heavy
      spec:
        maxReplicaCount: 4
  # sandbox-runner KEDA bounds scaled for this environment. The base ScaledObject
  # is 20->100 (§1 fleet table); keeping that here would pin a full production
  # runner tier in a non-production namespace.
  - target:
      kind: ScaledObject
      name: sandbox-runner
    patch: |-
      apiVersion: keda.sh/v1alpha1
      kind: ScaledObject
      metadata:
        name: sandbox-runner
      spec:
        minReplicaCount: 7
        maxReplicaCount: 34
