apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: redquant-prod
resources:
  - ../../base
  - namespace.yaml
labels:
  - pairs:
      app.kubernetes.io/environment: prod
    includeSelectors: false
patches:
  - target:
      kind: Deployment
      name: web
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: web
      spec:
        replicas: 12
  - target:
      kind: Deployment
      name: api
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: api
      spec:
        replicas: 16
  - target:
      kind: Deployment
      name: quantum-kernel
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: quantum-kernel
      spec:
        replicas: 24
  - target:
      kind: Deployment
      name: quantum-kernel-heavy
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: quantum-kernel-heavy
      spec:
        replicas: 0
  - target:
      kind: Deployment
      name: sandbox-runner
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: sandbox-runner
      spec:
        replicas: 20
  - target:
      kind: Deployment
      name: grader
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: grader
      spec:
        replicas: 8
  - target:
      kind: Deployment
      name: ai-tutor
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: ai-tutor
      spec:
        replicas: 6
configMapGenerator:
  - name: web-config
    behavior: merge
    literals:
      - DEPLOY_ENV=production
  - name: api-config
    behavior: merge
    literals:
      - DEPLOY_ENV=production
  - name: quantum-kernel-config
    behavior: merge
    literals:
      - DEPLOY_ENV=production
  - name: quantum-kernel-heavy-config
    behavior: merge
    literals:
      - DEPLOY_ENV=production
  - name: sandbox-runner-config
    behavior: merge
    literals:
      - DEPLOY_ENV=production
  - name: grader-config
    behavior: merge
    literals:
      - DEPLOY_ENV=production
  - name: ai-tutor-config
    behavior: merge
    literals:
      - DEPLOY_ENV=production
generatorOptions:
  disableNameSuffixHash: true
