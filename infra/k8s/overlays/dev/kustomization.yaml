apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: redquant-dev
resources:
  - ../../base
  - namespace.yaml
labels:
  - pairs:
      app.kubernetes.io/environment: dev
    includeSelectors: false
patches:
  - target:
      kind: Deployment
      name: web
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: web
      spec:
        replicas: 1
        template:
          spec:
            containers:
              - name: web
                resources:
                  requests:
                    cpu: "250m"
                    memory: "256Mi"
                  limits:
                    cpu: "500m"
                    memory: "512Mi"
  - target:
      kind: Deployment
      name: api
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: api
      spec:
        replicas: 1
        template:
          spec:
            containers:
              - name: api
                resources:
                  requests:
                    cpu: "250m"
                    memory: "256Mi"
                  limits:
                    cpu: "500m"
                    memory: "512Mi"
  - target:
      kind: Deployment
      name: quantum-kernel
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: quantum-kernel
      spec:
        replicas: 1
        template:
          spec:
            containers:
              - name: quantum-kernel
                resources:
                  requests:
                    cpu: "500m"
                    memory: "1Gi"
                  limits:
                    cpu: "1"
                    memory: "2Gi"
  - target:
      kind: Deployment
      name: quantum-kernel-heavy
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: quantum-kernel-heavy
      spec:
        replicas: 0
        template:
          spec:
            containers:
              - name: quantum-kernel-heavy
                resources:
                  requests:
                    cpu: "1"
                    memory: "2Gi"
                  limits:
                    cpu: "2"
                    memory: "4Gi"
  - target:
      kind: Deployment
      name: sandbox-runner
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: sandbox-runner
      spec:
        replicas: 1
        template:
          spec:
            containers:
              - name: sandbox-runner
                resources:
                  requests:
                    cpu: "250m"
                    memory: "256Mi"
                  limits:
                    cpu: "500m"
                    memory: "384Mi"
  - target:
      kind: Deployment
      name: grader
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: grader
      spec:
        replicas: 1
        template:
          spec:
            containers:
              - name: grader
                resources:
                  requests:
                    cpu: "250m"
                    memory: "256Mi"
                  limits:
                    cpu: "500m"
                    memory: "512Mi"
  - target:
      kind: Deployment
      name: ai-tutor
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: ai-tutor
      spec:
        replicas: 1
        template:
          spec:
            containers:
              - name: ai-tutor
                resources:
                  requests:
                    cpu: "100m"
                    memory: "256Mi"
                  limits:
                    cpu: "250m"
                    memory: "512Mi"
  # HPA bounds scaled for this environment. The base HPAs carry the §1 fleet-table
  # production maxima (web 40, api 60, quantum-kernel 120, ai-tutor 24); leaving those
  # unpatched would let a dev namespace scale to a full production tier, which is the
  # same reason the ScaledObject bounds below are capped. Capped at the dev KEDA max.
  - target:
      kind: HorizontalPodAutoscaler
      name: web
    patch: |-
      apiVersion: autoscaling/v2
      kind: HorizontalPodAutoscaler
      metadata:
        name: web
      spec:
        minReplicas: 1
        maxReplicas: 2
  - target:
      kind: HorizontalPodAutoscaler
      name: api
    patch: |-
      apiVersion: autoscaling/v2
      kind: HorizontalPodAutoscaler
      metadata:
        name: api
      spec:
        minReplicas: 1
        maxReplicas: 2
  - target:
      kind: HorizontalPodAutoscaler
      name: quantum-kernel
    patch: |-
      apiVersion: autoscaling/v2
      kind: HorizontalPodAutoscaler
      metadata:
        name: quantum-kernel
      spec:
        minReplicas: 1
        maxReplicas: 2
  - target:
      kind: HorizontalPodAutoscaler
      name: ai-tutor
    patch: |-
      apiVersion: autoscaling/v2
      kind: HorizontalPodAutoscaler
      metadata:
        name: ai-tutor
      spec:
        minReplicas: 1
        maxReplicas: 2
  - target:
      kind: ScaledObject
      name: grader
    patch: |-
      apiVersion: keda.sh/v1alpha1
      kind: ScaledObject
      metadata:
        name: grader
      spec:
        minReplicaCount: 1
        maxReplicaCount: 2
  - target:
      kind: ScaledObject
      name: quantum-kernel-heavy
    patch: |-
      apiVersion: keda.sh/v1alpha1
      kind: ScaledObject
      metadata:
        name: quantum-kernel-heavy
      spec:
        maxReplicaCount: 2
  # sandbox-runner KEDA bounds scaled for this environment. The base ScaledObject
  # is 20->100 (§1 fleet table); keeping that here would pin a full production
  # runner tier in a non-production namespace.
  - target:
      kind: ScaledObject
      name: sandbox-runner
    patch: |-
      apiVersion: keda.sh/v1alpha1
      kind: ScaledObject
      metadata:
        name: sandbox-runner
      spec:
        minReplicaCount: 1
        maxReplicaCount: 2
