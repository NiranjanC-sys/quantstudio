# One ServiceMonitor per service that exposes a metrics endpoint (SPEC.md service
# table). sandbox-runner has no network (§10) and therefore no ServiceMonitor: its
# execution stats are reported out-of-band by the grader that supervises it.
#
# Scraped by targetPort (the pod-level container port) rather than by Service port
# name, so this does not depend on how the owning workload manifests (base/workloads/,
# owned by another agent) name their Service ports.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: web
  labels:
    app.kubernetes.io/name: web
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: web
  endpoints:
    - targetPort: 3000
      path: /metrics
      interval: 15s
      scrapeTimeout: 10s
