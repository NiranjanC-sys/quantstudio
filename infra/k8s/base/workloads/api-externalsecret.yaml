apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: api
  labels:
    app.kubernetes.io/name: api
    app.kubernetes.io/component: api
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: redquant-secretstore
    kind: ClusterSecretStore
  target:
    name: api-secrets
  dataFrom:
    - extract:
        key: redquant/prod/api
