apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: web
  labels:
    app.kubernetes.io/name: web
    app.kubernetes.io/component: web
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: redquant-secretstore
    kind: ClusterSecretStore
  target:
    name: web-secrets
  dataFrom:
    - extract:
        key: redquant/prod/web
