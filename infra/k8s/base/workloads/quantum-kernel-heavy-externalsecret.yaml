apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: quantum-kernel-heavy
  labels:
    app.kubernetes.io/name: quantum-kernel-heavy
    app.kubernetes.io/component: quantum-kernel-heavy
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: redquant-secretstore
    kind: ClusterSecretStore
  target:
    name: quantum-kernel-heavy-secrets
  dataFrom:
    - extract:
        key: redquant/prod/quantum-kernel-heavy
