apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: sandbox-runner
  labels:
    app.kubernetes.io/name: sandbox-runner
    app.kubernetes.io/component: sandbox-runner
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: redquant-secretstore
    kind: ClusterSecretStore
  target:
    name: sandbox-runner-secrets
  dataFrom:
    - extract:
        key: redquant/prod/sandbox-runner
