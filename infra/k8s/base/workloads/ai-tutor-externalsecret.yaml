apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: ai-tutor
  labels:
    app.kubernetes.io/name: ai-tutor
    app.kubernetes.io/component: ai-tutor
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: redquant-secretstore
    kind: ClusterSecretStore
  target:
    name: ai-tutor-secrets
  dataFrom:
    - extract:
        key: redquant/prod/ai-tutor
