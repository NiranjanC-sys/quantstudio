apiVersion: apps/v1
kind: Deployment
metadata:
  name: quantum-kernel-heavy
  labels:
    app.kubernetes.io/name: quantum-kernel-heavy
    app.kubernetes.io/component: quantum-kernel-heavy
spec:
  replicas: 0
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: quantum-kernel-heavy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: quantum-kernel-heavy
        app.kubernetes.io/component: quantum-kernel-heavy
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8100"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: quantum-kernel-heavy
      automountServiceAccountToken: false
      priorityClassName: redquant-critical
      terminationGracePeriodSeconds: 60
      # The T-C tier (§4: 31-40 qubits, tensor-network and noisy density-matrix)
      # requests 96Gi/8 vCPU, which does not fit the c7g.2xlarge-class node the
      # §1 fleet table sizes the other six tiers against (8 vCPU / 16 GiB).
      # Without this selector the pod is permanently Pending: its memory request
      # alone exceeds a whole general-pool node. Pin it to a dedicated
      # memory-optimised pool, using the same `redquant.io/node-pool` convention
      # cluster/runtimeclass-gvisor.yaml uses for the sandbox pool. The pool is
      # tainted so nothing else lands on nodes this size.
      nodeSelector:
        redquant.io/node-pool: kernel-heavy
      tolerations:
        - key: redquant.io/kernel-heavy-only
          operator: Exists
          effect: NoSchedule
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: quantum-kernel-heavy
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: quantum-kernel-heavy
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: quantum-kernel-heavy
      containers:
        - name: quantum-kernel-heavy
          image: ghcr.io/redquant/quantum-kernel-heavy:0.1.0
          ports:
            - name: http
              containerPort: 8100
              protocol: TCP
          envFrom:
            - configMapRef:
                name: quantum-kernel-heavy-config
            - secretRef:
                name: quantum-kernel-heavy-secrets
          env:
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://otel-collector:4317"
            - name: OTEL_SERVICE_NAME
              value: "quantum-kernel-heavy"
            - name: OTEL_TRACES_SAMPLER
              value: "parentbased_traceidratio"
            - name: OTEL_TRACES_SAMPLER_ARG
              value: "0.01"
            - name: SIM_TIER
              value: "T-C"
          resources:
            requests:
              cpu: "8"
              memory: "96Gi"
            limits:
              cpu: "8"
              memory: "120Gi"
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            failureThreshold: 30
            periodSeconds: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 512Mi
