apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: grader
  labels:
    app.kubernetes.io/name: grader
    app.kubernetes.io/component: grader
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: redquant-secretstore
    kind: ClusterSecretStore
  target:
    name: grader-secrets
  dataFrom:
    - extract:
        key: redquant/prod/grader
