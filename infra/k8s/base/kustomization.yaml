apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - workloads
  - data
  - network
  - observability
  - ingress
labels:
  - pairs:
      app.kubernetes.io/part-of: redquant
    includeSelectors: false
images:
  - name: ghcr.io/redquant/web
    newTag: "0.1.0"
  - name: ghcr.io/redquant/api
    newTag: "0.1.0"
  - name: ghcr.io/redquant/quantum-kernel
    newTag: "0.1.0"
  - name: ghcr.io/redquant/quantum-kernel-heavy
    newTag: "0.1.0"
  - name: ghcr.io/redquant/sandbox-runner
    newTag: "0.1.0"
  - name: ghcr.io/redquant/grader
    newTag: "0.1.0"
  - name: ghcr.io/redquant/ai-tutor
    newTag: "0.1.0"
