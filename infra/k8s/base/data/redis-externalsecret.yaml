# Redis Cluster requires a shared AUTH password (requirepass/masterauth, wired via
# redis-cluster.yaml's REDIS_PASSWORD env var) for both client and inter-node auth.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: redquant-redis-credentials
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: redquant-secretstore
    kind: ClusterSecretStore
  target:
    name: redquant-redis-credentials
    creationPolicy: Owner
  data:
    - secretKey: redis-password
      remoteRef:
        key: redquant/prod/redis/cluster
        property: password
