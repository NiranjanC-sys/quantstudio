# Materialises Postgres credentials from the ClusterSecretStore. No literal secret
# values ever live in git: everything below is a remote reference resolved at sync
# time by external-secrets.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: redquant-pg-backup-s3-creds
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: redquant-secretstore
    kind: ClusterSecretStore
  target:
    name: redquant-pg-backup-s3-creds
    creationPolicy: Owner
  data:
    - secretKey: ACCESS_KEY_ID
      remoteRef:
        key: redquant/prod/postgres/backup-s3
        property: access_key_id
    - secretKey: ACCESS_SECRET_KEY
      remoteRef:
        key: redquant/prod/postgres/backup-s3
        property: secret_access_key
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: redquant-pg-app-readwrite
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: redquant-secretstore
    kind: ClusterSecretStore
  target:
    name: redquant-pg-app-readwrite
    creationPolicy: Owner
    template:
      type: kubernetes.io/basic-auth
  data:
    - secretKey: username
      remoteRef:
        key: redquant/prod/postgres/app-readwrite
        property: username
    - secretKey: password
      remoteRef:
        key: redquant/prod/postgres/app-readwrite
        property: password
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: redquant-pg-app-readonly
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: redquant-secretstore
    kind: ClusterSecretStore
  target:
    name: redquant-pg-app-readonly
    creationPolicy: Owner
    template:
      type: kubernetes.io/basic-auth
  data:
    - secretKey: username
      remoteRef:
        key: redquant/prod/postgres/app-readonly
        property: username
    - secretKey: password
      remoteRef:
        key: redquant/prod/postgres/app-readonly
        property: password
