# §10's isolation guarantee only holds if sandbox-runner pods can never
# accidentally schedule onto the default container runtime. Enforce it independently
# of whatever the workloads manifests declare.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: restrict-sandbox-runtimeclass
  annotations:
    policies.kyverno.io/title: Restrict sandbox-runner to the gvisor RuntimeClass
    policies.kyverno.io/category: RedQuant Sandbox Isolation (§10)
    policies.kyverno.io/severity: critical
    policies.kyverno.io/description: >-
      Any pod labelled app.kubernetes.io/name=sandbox-runner MUST set
      spec.runtimeClassName: gvisor. This is a second, independent line of
      defence behind the sandbox-runner NetworkPolicy (empty ingress/egress)
      and the pod's own read-only rootfs/seccomp/import-allowlist controls.
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: require-gvisor-runtimeclass
      match:
        any:
          - resources:
              kinds:
                - Pod
              selector:
                matchLabels:
                  app.kubernetes.io/name: sandbox-runner
      exclude:
        any:
          - resources:
              namespaces:
                - kube-system
      validate:
        message: "sandbox-runner pods must set spec.runtimeClassName: gvisor."
        pattern:
          spec:
            runtimeClassName: gvisor
