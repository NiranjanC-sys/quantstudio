module: t1.m2
cards:
  - id: t1.m2.d1
    front: "State the Born rule for a computational-basis measurement."
    back: "The probability of outcome x is the squared magnitude of the amplitude of |x>."
    lesson: t1.m2.l1
  - id: t1.m2.d2
    front: "A qubit is in 0.6|0> + 0.8|1>. What are the two outcome probabilities?"
    back: "0.36 for outcome 0 and 0.64 for outcome 1, since 0.36 + 0.64 = 1."
    lesson: t1.m2.l1
  - id: t1.m2.d3
    front: "What happens to the state immediately after a computational-basis measurement returns x?"
    back: "It collapses to |x>. Measuring again returns x with probability 1."
    lesson: t1.m2.l2
  - id: t1.m2.d4
    front: "Is measurement a unitary operation?"
    back: "No. It is not invertible, since two different inputs can give the same post-measurement state."
    lesson: t1.m2.l2
  - id: t1.m2.d5
    front: "How do you measure a qubit in the X basis using only computational-basis hardware?"
    back: "Apply H and then measure. H maps |+> to |0> and |-> to |1>."
    lesson: t1.m2.l3
  - id: t1.m2.d6
    front: "How do you measure a qubit in the Y basis using only computational-basis hardware?"
    back: "Apply S dagger, then H, then measure."
    lesson: t1.m2.l3
  - id: t1.m2.d7
    front: "What is the expected value of Z in the state |+>?"
    back: "Zero, because outcomes 0 and 1 are equally likely and Z assigns them +1 and -1."
    lesson: t1.m2.l3
  - id: t1.m2.d8
    front: "Which three expectation values determine a single-qubit state completely?"
    back: "<X>, <Y> and <Z>. They are the three components of the Bloch vector."
    lesson: t1.m2.l4
  - id: t1.m2.d9
    front: "Why does single-qubit tomography need three separate circuits?"
    back: "Because X, Y and Z do not commute, so no single measurement basis yields all three expectation values."
    lesson: t1.m2.l4
  - id: t1.m2.d10
    front: "Give the standard error of a probability estimated from N shots."
    back: "sqrt(p (1 - p) / N). At p = 0.5 with 4096 shots it is 0.007812."
    lesson: t1.m2.l5
  - id: t1.m2.d11
    front: "How many shots do you need to halve a shot-noise error bar?"
    back: "Four times as many, because the error scales as 1 over sqrt(N)."
    lesson: t1.m2.l5
  - id: t1.m2.d12
    front: "What is the standard error of a correlator estimated from N shots when its true value is E?"
    back: "sqrt((1 - E squared) / N). For E near 0.7071 and N = 4096 that is 0.011049."
    lesson: t1.m2.l5
  - id: t1.m2.d13
    front: "Does increasing the shot count reduce systematic error from noisy gates?"
    back: "No. More shots reduce variance only. A biased circuit estimates the wrong distribution more precisely."
    lesson: t1.m2.l5
