module: t0.m4
cards:
  - id: t0.m4.d1
    front: "What is the adjoint (dagger) of a matrix?"
    back: "Its conjugate transpose: transpose the matrix and take the complex conjugate of every entry."
    lesson: t0.m4.l1
  - id: t0.m4.d2
    front: "Give the defining condition for a unitary matrix."
    back: "U dagger U = U U dagger = I. Equivalently, U preserves the inner product and therefore every norm."
    lesson: t0.m4.l2
  - id: t0.m4.d3
    front: "Give the defining condition for a Hermitian matrix, and what its eigenvalues must be."
    back: "A dagger = A. All eigenvalues are real, which is why observables are Hermitian."
    lesson: t0.m4.l2
  - id: t0.m4.d4
    front: "Give the two defining conditions for an orthogonal projector."
    back: "P dagger = P and P squared = P. Its eigenvalues are therefore only 0 and 1."
    lesson: t0.m4.l2
  - id: t0.m4.d5
    front: "What are the possible moduli of the eigenvalues of a unitary matrix?"
    back: "All exactly 1, so every eigenvalue has the form exp(i phi) for a real phi."
    lesson: t0.m4.l2
  - id: t0.m4.d6
    front: "State the spectral theorem for a Hermitian matrix A."
    back: "A = sum over k of lambda_k |v_k><v_k|, with real lambda_k and an orthonormal eigenbasis {|v_k>}."
    lesson: t0.m4.l3
  - id: t0.m4.d7
    front: "How do you apply a function f to a diagonalisable matrix A = V D V inverse?"
    back: "f(A) = V f(D) V inverse, where f is applied to each diagonal entry of D."
    lesson: t0.m4.l4
  - id: t0.m4.d8
    front: "Give the series definition of the matrix exponential."
    back: "exp(A) = sum over k >= 0 of A to the k over k factorial. It converges for every square matrix."
    lesson: t0.m4.l4
  - id: t0.m4.d9
    front: "For a Hermitian H and real t, what kind of matrix is exp(-i H t)?"
    back: "Unitary. This is why time evolution generated by a Hermitian Hamiltonian preserves normalisation."
    lesson: t0.m4.l4
  - id: t0.m4.d10
    front: "When does exp(A) exp(B) equal exp(A + B)?"
    back: "When A and B commute. Otherwise the two differ, and the leading correction involves the commutator [A, B]."
    lesson: t0.m4.l4
  - id: t0.m4.d11
    front: "If P is a Pauli matrix, what is exp(-i theta P / 2) in closed form?"
    back: "cos(theta / 2) I - i sin(theta / 2) P, because P squared equals I."
    lesson: t0.m4.l4
  - id: t0.m4.d12
    front: "What is the trace of a matrix, and what is its value for a density matrix?"
    back: "The sum of the diagonal entries. For a density matrix it is exactly 1."
    lesson: t0.m4.l1
  - id: t0.m4.d13
    front: "Is every unitary matrix Hermitian?"
    back: "No. X, Y and Z are both; the S and T gates are unitary but not Hermitian, since their eigenvalues are not real."
    lesson: t0.m4.l2
